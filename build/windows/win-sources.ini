# Windows-only sources the Chromium lite tarball leaves out, unpacked by
# build/chromium/win-prepare.sh. "deps" = take the commit from the tree's own DEPS (so a new
# Chromium brings its own versions); "version" = fixed. From ungoogled-chromium-windows
# downloads.ini (157.0.8103.50-1.1); its LLVM/Rust/node/etc. entries are not needed here
# (Linux cross-build with Chromium's own toolchains).

[directx-headers]
deps = src/third_party/microsoft_dxheaders/src
url = https://github.com/microsoft/DirectX-Headers/archive/%(version)s.zip
download_filename = directx-headers-%(version)s.zip
output_path = third_party/microsoft_dxheaders/src
strip_leading_dirs = DirectX-Headers-%(version)s

[webauthn]
deps = src/third_party/microsoft_webauthn/src
url = https://github.com/microsoft/webauthn/archive/%(version)s.zip
download_filename = webauthn-%(version)s.zip
output_path = third_party/microsoft_webauthn/src
strip_leading_dirs = webauthn-%(version)s

[multimedia-redirection]
deps = src/third_party/microsoft_multimedia_redirection/src
url = https://github.com/microsoft/multimedia-redirection/archive/%(version)s.zip
download_filename = multimedia-redirection-%(version)s.zip
output_path = third_party/microsoft_multimedia_redirection/src
strip_leading_dirs = multimedia-redirection-%(version)s

[rust-windows-create]
version = 0.52.0
url = https://github.com/microsoft/windows-rs/archive/refs/tags/%(version)s.zip
download_filename = rust-windows-create-%(version)s.zip
sha512 = b505d45dfa201b0b2bf18aecea549fe72b60fbc7a2cb83d9319363e550585072cf87ce543ecf9e39d951dda2e60fcf3755bd75ead7096efdfa700f5faf781339
output_path = third_party/rust/chromium_crates_io/vendor
