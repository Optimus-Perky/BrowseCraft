# BrowseCraft sync server: `docker compose up -d`, then open http://<host>:8295 to make the
# first (admin) user. Put it behind your reverse proxy with HTTPS before using it outside
# your LAN: browsers send their sign-in token with every request.
services:
  browsecraft-sync:
    image: browsecraft-server:latest
    build: .
    container_name: browsecraft-sync
    restart: unless-stopped
    ports:
      - "8295:8295"
    volumes:
      - ./data:/data
    # Domain sign-in (Active Directory or Samba AD), optional. Users sign in with their domain
    # user name and password; their account here is made the first time. LDAPS only: put the
    # DCs' certificates (or the CA that issued them) in ./data/ldap-ca.pem.
    # environment:
    #   BROWSECRAFT_LDAP_URL: ldaps://dc01.example.lan,ldaps://dc02.example.lan
    #   BROWSECRAFT_LDAP_DOMAIN: example.lan
    #   BROWSECRAFT_LDAP_CA_FILE: /data/ldap-ca.pem
    #   BROWSECRAFT_LDAP_ADMIN_GROUP: Domain Admins   # "none" for no domain admins
    #   BROWSECRAFT_LDAP_USER_GROUP: BrowseCraft Users  # leave out to let any enabled user in
    # Single sign-on from domain PCs (Kerberos): give the server a DNS name (e.g. browsecraft.example.lan),
    # make a service account with the SPN HTTP/<that name> and AES keys, put its keytab in ./data and
    # its password in ./data/ldap-bind-password (0600; for reading users' entries), then:
    #   KRB5_KTNAME: /data/browsecraft.keytab
    #   BROWSECRAFT_LDAP_BIND_USER: svc-browsecraft
    #   BROWSECRAFT_LDAP_BIND_PASSWORD_FILE: /data/ldap-bind-password
    # and point the BrowseCraft policy SyncServerUrl at http(s)://<that name>:8295.
    # Windows DCs with a self-signed LDAPS certificate: put it in LocalMachine\My AND in the DC's
    # own LocalMachine\Root, or Schannel won't use it ("No suitable default server credential").
