[package]
name = "browsecraft-server"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "BrowseCraft sync server: your own Chrome sync, for your home lab"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs", "time"] }
axum = "0.8"
prost = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
ring = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
